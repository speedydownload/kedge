name: ballast
description: "Ballast blocks distracting apps on a schedule or on demand, and makes it deliberately annoying to unblock early."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  go_router: ^17.5.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  purchases_flutter: ^10.9.1
  posthog_flutter: ^5.36.4
  path_provider: ^2.1.6
  intl: ^0.20.3
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ">=4.0.4 <4.0.6"
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Launcher icons. Rebuild: python tool/generate_icons.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  image_path_ios: assets/brand/logo_1024.png
  remove_alpha_ios: true
  android: true
  image_path_android: assets/brand/logo_512.png
  adaptive_icon_foreground: assets/brand/icon_foreground_432.png
  adaptive_icon_background: assets/brand/icon_background_432.png

# Splash. Rebuild: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D1117"
  image: assets/brand/splash_logo_640.png
  color_dark: "#0D1117"
  image_dark: assets/brand/splash_logo_640.png
  android_12:
    color: "#0D1117"
    image: assets/brand/splash_logo_640.png
    color_dark: "#0D1117"
    image_dark: assets/brand/splash_logo_640.png
